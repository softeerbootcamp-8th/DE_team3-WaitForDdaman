# gold.dim_bike DQ 어써션
#
# build_dim_bike.py의 하드 게이트(QualityCheck)가 has_uniqueness(threshold=0.99)로
# bike_id 중복률 1%까지는 통과시킨다 - 그 이하 값은 지금까지 어디에도 안 남았다.
# 여기서는 하드 게이트보다 낮은 임계(0.5%)로 먼저 걸어서, 실제로 배치를 막기 전에
# 추이로 조기경보를 볼 수 있게 한다.

source_name: gold_dim_bike
target_table: gold.dim_bike
partition_column: snapshot_date

checks:
  - check_name: bike_id_duplicate_rate
    target_column: bike_id
    severity: error
    comparison: lte
    threshold: 0.005
    description: "bike_id 중복 비율 - 하드 게이트(1%)보다 낮은 조기경보 임계"
    metric_sql: |
      SELECT CAST(COUNT(*) FILTER (WHERE cnt > 1) AS DOUBLE) / COUNT(*)
      FROM (
        SELECT bike_id, COUNT(*) OVER (PARTITION BY bike_id) AS cnt
        FROM {table}
      )
