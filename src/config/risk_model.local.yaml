# 로컬 실데이터(LocalStack Iceberg, bike_catalog) 스모크 테스트용.
# rental_history 가 2026-06-01~07-02(32일)만 backfill 된 현재 상태에 맞춰
# horizon/holdout/step 을 축소했다 — 상세 근거는 run: 섹션 주석 참조.
# rental_history 가 충분히 쌓이면 risk_model.yaml(운영값)로 다시 돌릴 것.
#   RISK_MODEL_CONFIG=/opt/airflow/pylib/config/risk_model.local.yaml

run:
  # ── 로컬 실데이터 스모크 테스트 전용 값 ──────────────────────────────
  # rental_history 가 현재 2026-06-01~07-02(32일)만 backfill 되어 있어
  # 운영 설계(window14+horizon14+gap14+holdout60+rolling24개월)가 이 구간에
  # 전혀 들어가지 않는다. horizon/holdout/step 만 축소해 "코드가 실 스키마·
  # 실 데이터로 에러 없이 도는지"를 확인하는 용도다.
  # → rental_history 가 6~7개월 이상 쌓이면 risk_model.yaml(운영값)로 재실행할 것.
  window_days: 14              # 유지 — 피처 정의를 바꾸지 않기 위해
  horizon_days: 3              # 운영 14 → 3. 라벨 정의가 바뀌므로 지표는 참고용 아님
  holdout_days: 3              # 운영 60 → 3. 가용 구간(18일) 안에 gap+holdout을 넣기 위해
  anchor_step_days: 1          # 운영 7 → 1. 앵커 수를 최대한 확보
  rolling_months: 1            # 계산상 train_start 가 05-28까지 밀리지만 실data는 06-01부터라
                                # 05월 앵커는 그냥 0행(무해). 06-15 이전 앵커는 창이 덜 채워짐.
  exclude_recent_days: 30
  top_k: 500                   # 실 자전거수(38,832대)가 운영 규모이므로 그대로
  fail_window_days: 150
  fault_lookback_days: null
  min_rent_date: null
  saessak_min_num: 80000

sources:
  mode: iceberg
  assume_silver_clean: false
  rental_history: "silver.rental_history"
  failure_report: "silver.failure_report"
  rental_columns:
    bike_id: bike_id
    rent_at: rent_dt
    return_at: return_dt
    dist_m: use_distance_m
    rent_station: rent_station_id
    return_station: return_station_id
    dur_min: null           # silver 에 이용시간 컬럼 없음 → return_dt - rent_dt 로 파생
  fault_columns:
    bike_id: bike_no
    reported_at: reg_dttm

cleaning:
  max_speed_kmh: 45
  max_dist_m: 50000
  zero_dur_max_dist: 5000
  instant_return_max_dist_m: 10

paths:
  train_sample: "s3a://waitforddaman-warehouse/ml/risk_model/train_sample"   # Spark 쓰기 → s3a
  label_pos_new: "s3a://waitforddaman-warehouse/ml/risk_model/label_pos_new" # Spark 쓰기 → s3a
  model_root: "s3://waitforddaman-warehouse/ml/risk_model/models"            # boto3 쓰기 → s3

quality:
  min_train_rows: 2000          # 13개 유효앵커 × 3만여대 감안하면 충분히 넘을 것
  min_anchors: 5                # 06-15~06-27 13개 앵커 기대, 여유 있게 5로
  min_pos_rate: 0.0001
  max_pos_rate: 0.5
  max_feature_null_rate: 0.0
  min_holdout_anchors_with_pos: 1   # 홀드아웃이 3일뿐이라 낮춤

gate:
  metric: capture_at_k
  max_drop_pp: 2.0

models:
  candidates: ["rule_trips", "logreg", "lgbm"]
  primary: "lgbm"
  logreg:
    max_iter: 1000
  lgbm:
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 7
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 10
    random_state: 42
    n_jobs: 1
    verbose: -1
    is_unbalance: true     # 양성비율 낮은(~2%) 불균형 데이터라 손실에 클래스 가중치 반영 (실측: median 2%->48% 확률 이동)

mlflow:
  enabled: false
  tracking_uri: "http://mlflow:5000"
  experiment: "ttareungi-risk-model"
  registered_model: "risk_model"
  champion_alias: "champion"

