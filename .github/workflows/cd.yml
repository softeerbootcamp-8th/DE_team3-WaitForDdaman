name: CD

on:
  push:
    branches: [production]

permissions:
  id-token: write   # OIDC role assumption
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (arm64 cross-build - EC2는 t4g.large/Graviton)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-airflow:latest
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-airflow:${{ github.sha }}

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-api:latest
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-api:${{ github.sha }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: services/web
          file: services/web/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-web:latest
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-web:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/waitforddaman
            export ECR_REGISTRY=${{ needs.build-and-push.outputs.registry }}
            export IMAGE_TAG=${{ github.sha }}
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
