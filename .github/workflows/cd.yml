name: CD

on:
  push:
    branches: [production]
    # 배포 산출물에 영향이 없는 것만 보수적으로 제외한다. paths-ignore는 "이 경로들
    # 만 바뀐 경우 실행하지 않는다"는 뜻이라, 앱 코드와 문서를 같이 바꾼 머지는 정상
    # 배포된다 - 배포가 필요한데 안 도는 상황은 만들어지지 않는다.
    #
    # 이게 없으면 README 한 줄이나 CI YAML만 고치는 머지도 arm64 QEMU 크로스빌드로
    # 이미지 3개를 다시 만들고 EC2에서 컨테이너를 교체한다. down -v가 아니라 로그
    # 볼륨/RDS는 안전하지만 실행 중인 Airflow 태스크는 끊긴다.
    #
    # cd.yml 자신은 넣지 않는다 - 배포 경로가 바뀌었으면 실제로 한 번 돌려봐야 한다.
    # docker-compose.prod.yml / Dockerfile.prod / services/** 도 절대 넣지 말 것.
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # paths-ignore로 배포가 스킵됐는데 그래도 배포해야 할 때의 탈출구.
  workflow_dispatch:   # 이미지 재빌드/재배포를 수동으로 돌리고 싶을 때

permissions:
  id-token: write   # OIDC 토큰 발급 (AWS 역할 assume에 필요)
  contents: read

env:
  AWS_REGION: ap-northeast-2

# 동시 실행되면 한쪽이 SSH 규칙을 회수하는 사이 다른 쪽이 배포 중일 수 있고,
# 같은 컨테이너를 동시에 교체하게 되므로 배포는 직렬화한다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      # 정적 AWS 키를 쓰지 않는다 - OIDC로 waitforddaman-gha-role을 assume한다.
      # 이 역할의 trust policy가 production 브랜치로만 제한돼 있어서 다른
      # 브랜치/저장소에서는 assume 자체가 실패한다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # EC2가 t4g.large(arm64/Graviton)인데 GitHub 러너는 x86_64라서, RUN 스텝
      # (pip install, apt-get, npm run build)을 실행하려면 QEMU 에뮬레이션이 필요하다.
      # --platform만 지정하면 exec format error로 죽는다.
      - name: Set up QEMU (arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # :latest 외에 커밋 SHA 태그도 붙인다 - 지금 서버에 어느 커밋이 떠 있는지
      # 추적하고 문제 시 특정 버전으로 롤백할 수 있게.
      - name: Build & push airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile.prod
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-airflow:latest
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-airflow:${{ github.sha }}

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile.prod
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-api:latest
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-api:${{ github.sha }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: services/web
          file: services/web/Dockerfile.prod
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-web:latest
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-web:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 보안그룹 22번 포트는 팀 IP만 허용하고 있어서 러너가 그냥은 SSH를 못 붙는다.
      # GitHub 러너 IP는 매 실행마다 바뀌므로, 배포 직전에 이 실행의 IP만 열고
      # 끝나면 반드시 닫는다(아래 revoke 스텝이 if: always()).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get runner public IP
        id: runner-ip
        run: echo "ip=$(curl -sf --retry 3 https://checkip.amazonaws.com | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Open SSH for this runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SSH_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG
          script: |
            set -e
            cd /opt/waitforddaman
            # EC2는 자체 인스턴스 IAM 역할로 ECR pull한다(GitHub OIDC와는 별개 경로)
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.prod.yml pull
            # up -d로 컨테이너만 교체한다. DB는 RDS에 있어서 컨테이너 교체와
            # 무관하지만, down -v는 airflow-logs-volume(DAG 실행 로그)을 날리므로
            # 배포 경로에서는 쓰지 않는다.
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

      # if: always() - 배포가 실패해도 열어둔 22번 규칙은 반드시 회수한다.
      # 이게 없으면 실패한 실행의 러너 IP가 영구히 남아 SG가 계속 오염된다.
      - name: Close SSH for this runner
        if: always() && steps.runner-ip.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SSH_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32
