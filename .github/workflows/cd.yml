name: CD

on:
  push:
    branches: [production]
    # 배포 산출물에 영향이 없는 것만 보수적으로 제외한다. paths-ignore는 "이 경로들
    # 만 바뀐 경우 실행하지 않는다"는 뜻이라, 앱 코드와 문서를 같이 바꾼 머지는 정상
    # 배포된다 - 배포가 필요한데 안 도는 상황은 만들어지지 않는다.
    #
    # 이게 없으면 README 한 줄이나 CI YAML만 고치는 머지도 arm64 QEMU 크로스빌드로
    # 이미지 3개를 다시 만들고 EC2에서 컨테이너를 교체한다. down -v가 아니라 로그
    # 볼륨/RDS는 안전하지만 실행 중인 Airflow 태스크는 끊긴다.
    #
    # cd.yml 자신은 넣지 않는다 - 배포 경로가 바뀌었으면 실제로 한 번 돌려봐야 한다.
    # docker-compose.prod.yml / Dockerfile.prod / services/** 도 절대 넣지 말 것.
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # paths-ignore로 배포가 스킵됐는데 그래도 배포해야 할 때의 탈출구.
  workflow_dispatch:   # 이미지 재빌드/재배포를 수동으로 돌리고 싶을 때

permissions:
  id-token: write   # OIDC 토큰 발급 (AWS 역할 assume에 필요)
  contents: read

env:
  AWS_REGION: ap-northeast-2

# 동시 실행되면 한쪽이 SSH 규칙을 회수하는 사이 다른 쪽이 배포 중일 수 있고,
# 같은 컨테이너를 동시에 교체하게 되므로 배포는 직렬화한다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 4개 이미지가 서로 독립적인데 예전엔 한 잡 안에서 순서대로 빌드해서
    # (airflow 6분 + api 2분 + web 1.5분 + spark 1.5분) 배포 하나에 11분 넘게
    # 걸렸다. matrix로 쪼개서 병렬로 돌리면 총 소요시간이 "합"이 아니라
    # "가장 느린 것 하나"(대개 airflow)에 수렴한다. public 레포라 Linux 러너
    # Actions 분(分)은 무료라 잡을 늘려도 비용 문제는 없다.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: airflow
            dockerfile: airflow/Dockerfile.prod
            context: .
            platform: linux/arm64
          - image: api
            dockerfile: services/api/Dockerfile.prod
            context: .
            platform: linux/arm64
          - image: web
            dockerfile: services/web/Dockerfile.prod
            context: services/web
            platform: linux/arm64
          - image: emr-spark-prod
            dockerfile: spark/Dockerfile.prod
            context: .
            platform: linux/amd64
    outputs:
      # matrix 잡에서 같은 output 이름에 여러 leg가 쓰면 그중 하나의 값이
      # 채택된다(GitHub Actions 공식 동작) - 4개 leg 모두 같은 AWS 계정/리전으로
      # 로그인하므로 어느 leg의 값이 남아도 동일해서 문제 없다.
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      # 정적 AWS 키를 쓰지 않는다 - OIDC로 waitforddaman-gha-role을 assume한다.
      # 이 역할의 trust policy가 production 브랜치로만 제한돼 있어서 다른
      # 브랜치/저장소에서는 assume 자체가 실패한다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # EC2가 t4g.large(arm64/Graviton)인데 GitHub 러너는 x86_64라서, RUN 스텝
      # (pip install, apt-get, npm run build)을 실행하려면 QEMU 에뮬레이션이 필요하다.
      # --platform만 지정하면 exec format error로 죽는다. spark는 amd64로 네이티브
      # 빌드하므로 QEMU가 필요 없다.
      - name: Set up QEMU (arm64 cross-build)
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # :latest 외에 커밋 SHA 태그도 붙인다 - 지금 서버에 어느 커밋이 떠 있는지
      # 추적하고 문제 시 특정 버전으로 롤백할 수 있게.
      #
      # cache-from/cache-to에 이미지별 scope를 준다 - scope 없이 기본 scope
      # 하나를 4개 이미지가 공유하면 뒤에 도는 이미지의 cache-to가 앞선 이미지의
      # 캐시를 밀어내 버려서, DAG 코드만 바뀐 배포에서도 airflow의 apt-get/pip
      # install 레이어가 매번 캐시 미스로 새로 돌았다(실측: 매 배포 6분 안팎 고정).
      - name: Build & push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-${{ matrix.image }}:latest
            ${{ steps.login-ecr.outputs.registry }}/waitforddaman-${{ matrix.image }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # docker-compose.prod.yml을 서버로 동기화하려면 러너 워크스페이스에 실제
      # 파일이 있어야 한다 - 이전엔 이 job에 checkout이 없어서 "이미지는 최신인데
      # compose 파일은 예전 그대로"인 드리프트가 생겼다(실측: 2026-08-24, EMR
      # Serverless PR이 compose에 EMR_SPARK_* 환경변수를 추가했는데 서버 파일이
      # 갱신 안 돼 컨테이너가 그 값을 계속 빈 문자열로 받음 - Issue #219).
      - uses: actions/checkout@v4

      # 보안그룹 22번 포트는 팀 IP만 허용하고 있어서 러너가 그냥은 SSH를 못 붙는다.
      # GitHub 러너 IP는 매 실행마다 바뀌므로, 배포 직전에 이 실행의 IP만 열고
      # 끝나면 반드시 닫는다(아래 revoke 스텝이 if: always()).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get runner public IP
        id: runner-ip
        run: echo "ip=$(curl -sf --retry 3 https://checkip.amazonaws.com | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Open SSH for this runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SSH_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32
          sleep 5

      # docker-compose.prod.yml은 시크릿을 담지 않는 파일(.env 참조만 있음)이라
      # git이 source of truth여야 한다. 별도 scp 스텝 대신 base64 payload로
      # ssh-action에 직접 넘겨 동기화하므로 네트워크/배너 교환 타임아웃 실패가 없다.
      - name: Prepare docker-compose.prod.yml payload
        id: compose-payload
        run: echo "content=$(base64 docker-compose.prod.yml | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: ECR_REGISTRY,IMAGE_TAG,COMPOSE_PAYLOAD
          script: |
            set -e
            cd /opt/waitforddaman
            echo "$COMPOSE_PAYLOAD" | base64 -d > docker-compose.prod.yml
            if [ -z "$ECR_REGISTRY" ]; then
              ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
              ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com"
            fi
            export ECR_REGISTRY
            export IMAGE_TAG="${IMAGE_TAG:-latest}"
            # EC2는 자체 인스턴스 IAM 역할로 ECR pull한다(GitHub OIDC와는 별개 경로)
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            echo "==> Pulling images sequentially (web -> api -> airflow) to avoid I/O freeze"
            docker compose -f docker-compose.prod.yml pull web
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml pull airflow-scheduler
            # up -d --force-recreate로 최신 이미지로 컨테이너를 강제 교체한다.
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            docker image prune -a -f --filter "until=24h" || docker image prune -f
            docker compose -f docker-compose.prod.yml ps
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          COMPOSE_PAYLOAD: ${{ steps.compose-payload.outputs.content }}

      - name: Update EMR Serverless application image
        continue-on-error: true
        run: |
          APP_ID="00g87apnd47p1r2p"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/waitforddaman-emr-spark-prod:latest"
          echo "==> Updating EMR Serverless application ($APP_ID) to $IMAGE_URI"
          aws emr-serverless update-application \
            --application-id "$APP_ID" \
            --image-configuration imageUri="$IMAGE_URI" \
            --region ${{ env.AWS_REGION }} || true

      # if: always() - 배포가 실패해도 열어둔 22번 규칙은 반드시 회수한다.
      # 이게 없으면 실패한 실행의 러너 IP가 영구히 남아 SG가 계속 오염된다.
      - name: Close SSH for this runner
        if: always() && steps.runner-ip.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SSH_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32
