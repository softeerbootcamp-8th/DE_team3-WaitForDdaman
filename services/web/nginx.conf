server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: 클라이언트 라우트를 하드 리프레시해도 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # api.ts가 /api 상대경로로 fetch하므로 같은 오리진에서 api 컨테이너로 프록시.
    # proxy_pass에 변수를 써서 DNS를 요청 시점에 지연 조회한다 - 그냥 호스트명을
    # 쓰면 nginx가 시작 시점에 한 번만 조회하고, api가 그 순간 떠 있지 않으면
    # (재기동 타이밍 등) nginx 자체가 기동을 거부해 사이트 전체가 죽는다.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
